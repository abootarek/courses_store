name: course_store
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  cached_network_image: ^3.4.1
  chewie: ^1.11.3
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_auth: ^5.3.3
  firebase_core: ^3.15.2
  firebase_storage: ^12.4.10
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  go_router: ^14.6.2
  image_picker: ^1.1.2
  screenshot_blocker: ^0.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_player: ^2.9.2
  youtube_player_flutter: ^9.0.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  package_info_plus: ^8.0.0

flutter:
  uses-material-design: true

  # Assets (مثل الأيقونة)
  assets:
    - assets/

  # إعدادات الأيقونة
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"  # حط صورتك هنا باسم app_icon.png
